# @package _global_
# Standalone FlashSAC E03 baseline with single-frame WoState observations.
# No observation noise, reset perturbations, pushes, action delay, or physics DR.
# Fixed WoState PD gains and grouped action scales match the source experiment.
training:
  task_name: EngineAIT800MotionTracking
  sim_backend: mjwarp
  play_steps: 1000
  play_env_num: 1
  inference_request_timeout_sec: 300.0

# Keep the installed FlashSAC defaults except for this collection/update budget.
algo:
  num_envs: 2048
  max_iterations: 25000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  updates_per_step: 4
  policy_frequency: 2
env:
  seed: null
  scene:
    model_file: assets/robots/t800/scene_flat.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: LINK_BASE
        joint_names:
        - J00_HIP_PITCH_L
        - J01_HIP_ROLL_L
        - J02_HIP_YAW_L
        - J03_KNEE_PITCH_L
        - J04_ANKLE_PITCH_L
        - J05_ANKLE_ROLL_L
        - J06_HIP_PITCH_R
        - J07_HIP_ROLL_R
        - J08_HIP_YAW_R
        - J09_KNEE_PITCH_R
        - J10_ANKLE_PITCH_R
        - J11_ANKLE_ROLL_R
        - J12_TORSO_YAW
        - J13_SHOULDER_PITCH_L
        - J14_SHOULDER_ROLL_L
        - J15_SHOULDER_YAW_L
        - J16_ELBOW_PITCH_L
        - J17_ELBOW_YAW_L
        - J18_SHOULDER_PITCH_R
        - J19_SHOULDER_ROLL_R
        - J20_SHOULDER_YAW_R
        - J21_ELBOW_PITCH_R
        - J22_ELBOW_YAW_R
        - J23_HEAD_PITCH
        - J24_HEAD_YAW
        actuator_names:
        - J00_HIP_PITCH_L
        - J01_HIP_ROLL_L
        - J02_HIP_YAW_L
        - J03_KNEE_PITCH_L
        - J04_ANKLE_PITCH_L
        - J05_ANKLE_ROLL_L
        - J06_HIP_PITCH_R
        - J07_HIP_ROLL_R
        - J08_HIP_YAW_R
        - J09_KNEE_PITCH_R
        - J10_ANKLE_PITCH_R
        - J11_ANKLE_ROLL_R
        - J12_TORSO_YAW
        - J13_SHOULDER_PITCH_L
        - J14_SHOULDER_ROLL_L
        - J15_SHOULDER_YAW_L
        - J16_ELBOW_PITCH_L
        - J17_ELBOW_YAW_L
        - J18_SHOULDER_PITCH_R
        - J19_SHOULDER_ROLL_R
        - J20_SHOULDER_YAW_R
        - J21_ELBOW_PITCH_R
        - J22_ELBOW_YAW_R
        - J23_HEAD_PITCH
        - J24_HEAD_YAW
        body_names:
        - LINK_BASE
        - LINK_HIP_ROLL_L
        - LINK_KNEE_PITCH_L
        - LINK_ANKLE_ROLL_L
        - LINK_HIP_ROLL_R
        - LINK_KNEE_PITCH_R
        - LINK_ANKLE_ROLL_R
        - LINK_WAIST_YAW
        - LINK_SHOULDER_ROLL_L
        - LINK_ELBOW_YAW_L
        - LINK_WRIST_END_L
        - LINK_SHOULDER_ROLL_R
        - LINK_ELBOW_YAW_R
        - LINK_WRIST_END_R
        - LINK_HEAD_YAW
        geom_names:
        - left_foot_contact_0_geom
        - left_foot_contact_1_geom
        - left_foot_contact_2_geom
        - left_foot_contact_3_geom
        - right_foot_contact_0_geom
        - right_foot_contact_1_geom
        - right_foot_contact_2_geom
        - right_foot_contact_3_geom
  sim_dt: 0.006666666666666667
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  observations:
    actor:
      # Retain inactive noise fields to match existing Sim2Sim snapshots.
      enable_corruption: false
      terms:
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: motion
        motion_anchor_pos_b: null
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params:
            command_name: motion
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.05
            n_max: 0.05
        base_lin_vel: null
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
          history_length: 1
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params:
            command_name: motion
          history_length: 1
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          history_length: 1
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: [-0.5, -0.5, -0.5, -0.5, -3.0, -3.0, -0.5, -0.5, -0.5, -0.5, -3.0, -3.0, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5]
            n_max: [0.5, 0.5, 0.5, 0.5, 3.0, 3.0, 0.5, 0.5, 0.5, 0.5, 3.0, 3.0, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
        actions:
          func: unilab.envs.mdp.last_action
          history_length: 1
    critic:
      terms:
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: motion
        motion_anchor_pos_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_pos_b
          params:
            command_name: motion
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params:
            command_name: motion
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: pelvis_local_linvel
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params:
            command_name: motion
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
        body_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_pos_b
          params:
            command_name: motion
        body_ori:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_ori_b
          params:
            command_name: motion
        sac_base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: pelvis_local_linvel
      enable_corruption: false
  actions:
    joint_pos:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionJointPositionActionCfg
      entity_name: robot
      actuator_names:
      - J00_HIP_PITCH_L
      - J01_HIP_ROLL_L
      - J02_HIP_YAW_L
      - J03_KNEE_PITCH_L
      - J04_ANKLE_PITCH_L
      - J05_ANKLE_ROLL_L
      - J06_HIP_PITCH_R
      - J07_HIP_ROLL_R
      - J08_HIP_YAW_R
      - J09_KNEE_PITCH_R
      - J10_ANKLE_PITCH_R
      - J11_ANKLE_ROLL_R
      - J12_TORSO_YAW
      - J13_SHOULDER_PITCH_L
      - J14_SHOULDER_ROLL_L
      - J15_SHOULDER_YAW_L
      - J16_ELBOW_PITCH_L
      - J17_ELBOW_YAW_L
      - J18_SHOULDER_PITCH_R
      - J19_SHOULDER_ROLL_R
      - J20_SHOULDER_YAW_R
      - J21_ELBOW_PITCH_R
      - J22_ELBOW_YAW_R
      - J23_HEAD_PITCH
      - J24_HEAD_YAW
      scale:
        # SAC outputs [-1, 1]; PPO's small scales cannot represent this motion.
        # Three non-overlapping groups cover the reference plus >=10% margin.
        'J(0[0-9]|1[0-2])_.*': 2.5  # legs and waist
        'J(1[3-9]|2[0-2])_.*': 3.0  # arms
        'J2[34]_.*': 0.2  # head
      use_default_offset: true
      command_name: motion
      simulate_action_latency: false
  commands:
    motion: &motion_command
      _target_: engineai_rl_unilab.tasks.t800.manager_terms.OfficialMotionCommandCfg
      entity_name: robot
      resampling_time_range:
      - 1.0e9
      - 1.0e9
      params: &motion_params
        motion_file: assets/motions/t800/dance1_subject2_t800_first18s_mujoco_v2.npz
        anchor_body_name: LINK_BASE
        body_names:
        - LINK_BASE
        - LINK_HIP_ROLL_L
        - LINK_KNEE_PITCH_L
        - LINK_ANKLE_ROLL_L
        - LINK_HIP_ROLL_R
        - LINK_KNEE_PITCH_R
        - LINK_ANKLE_ROLL_R
        - LINK_WAIST_YAW
        - LINK_SHOULDER_ROLL_L
        - LINK_ELBOW_YAW_L
        - LINK_WRIST_END_L
        - LINK_SHOULDER_ROLL_R
        - LINK_ELBOW_YAW_R
        - LINK_WRIST_END_R
        - LINK_HEAD_YAW
        sampling_mode: adaptive
        sampling_start_ratio: 0.0
        truncate_on_clip_end: true
        pose_range:
          x:
          - 0.0
          - 0.0
          y:
          - 0.0
          - 0.0
          z:
          - 0.0
          - 0.0
          roll:
          - 0.0
          - 0.0
          pitch:
          - 0.0
          - 0.0
          yaw:
          - 0.0
          - 0.0
        velocity_range:
          x:
          - 0.0
          - 0.0
          y:
          - 0.0
          - 0.0
          z:
          - 0.0
          - 0.0
          roll:
          - 0.0
          - 0.0
          pitch:
          - 0.0
          - 0.0
          yaw:
          - 0.0
          - 0.0
        joint_position_range:
        - 0.0
        - 0.0
        joint_default_position_range:
        - 0.0
        - 0.0
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    motion_clip_end:
      func: unilab.tasks.motion_tracking.common.manager_terms.motion_clip_end
      time_out: true
      params:
        command_name: motion
    anchor_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_pos_z_only
      params:
        command_name: motion
        threshold: 0.5
    anchor_ori:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_ori
      params:
        command_name: motion
        threshold: 0.8
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    ee_body_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_motion_body_pos_z_only
      params:
        command_name: motion
        threshold: 0.5
        body_names:
        - LINK_ANKLE_ROLL_L
        - LINK_ANKLE_ROLL_R
        - LINK_WRIST_END_L
        - LINK_WRIST_END_R
  policy_observation_group: actor
  critic_observation_group: critic
  events:
    official_pd_hip_pitch_and_knee_pitch:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 180.0
        - 180.0
        kd_range:
        - 5.0
        - 5.0
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J00_HIP_PITCH_L
          - J03_KNEE_PITCH_L
          - J06_HIP_PITCH_R
          - J09_KNEE_PITCH_R
    official_pd_hip_roll:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 100.0
        - 100.0
        kd_range:
        - 3.0
        - 3.0
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J01_HIP_ROLL_L
          - J07_HIP_ROLL_R
    official_pd_hip_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 100.0
        - 100.0
        kd_range:
        - 3.0
        - 3.0
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J02_HIP_YAW_L
          - J08_HIP_YAW_R
    official_pd_ankles:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 40.0
        - 40.0
        kd_range:
        - 2.0
        - 2.0
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J04_ANKLE_PITCH_L
          - J05_ANKLE_ROLL_L
          - J10_ANKLE_PITCH_R
          - J11_ANKLE_ROLL_R
    official_pd_torso_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 100.0
        - 100.0
        kd_range:
        - 3.0
        - 3.0
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J12_TORSO_YAW
    official_pd_shoulders_and_elbow_pitch:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 50.0
        - 50.0
        kd_range:
        - 0.3
        - 0.3
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J13_SHOULDER_PITCH_L
          - J14_SHOULDER_ROLL_L
          - J15_SHOULDER_YAW_L
          - J16_ELBOW_PITCH_L
          - J18_SHOULDER_PITCH_R
          - J19_SHOULDER_ROLL_R
          - J20_SHOULDER_YAW_R
          - J21_ELBOW_PITCH_R
    official_pd_heads_and_elbow_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range:
        - 50.0
        - 50.0
        kd_range:
        - 0.3
        - 0.3
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
          - J17_ELBOW_YAW_L
          - J22_ELBOW_YAW_R
          - J23_HEAD_PITCH
          - J24_HEAD_YAW
reward:
  motion_global_root_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_position_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.3
  motion_global_root_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_orientation_error_exp
    weight: 0.5
    params:
      command_name: motion
      std: 0.4
  motion_body_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_error_exp
    weight: 2.0
    params:
      command_name: motion
      std: 0.3
  motion_body_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_orientation_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.4
  motion_body_lin_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 1.0
  motion_body_ang_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 3.14
  motion_joint_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_position_error_exp
    weight: 2.0
    params:
      command_name: motion
      std: 0.8
  motion_joint_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_velocity_error_exp
    weight: 0.0
    params:
      command_name: motion
      std: 1.0
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.1
  joint_limit:
    func: unilab.tasks.motion_tracking.common.manager_terms.joint_pos_limits
    weight: -2.0
    params:
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: .*
  undesired_contacts:
    func: unilab.tasks.motion_tracking.common.manager_terms.undesired_body_contacts
    weight: -0.1
    params:
      command_name: motion
      threshold: 0.05
      body_names:
      - LINK_BASE
      - LINK_HIP_ROLL_L
      - LINK_KNEE_PITCH_L
      - LINK_HIP_ROLL_R
      - LINK_KNEE_PITCH_R
      - LINK_WAIST_YAW
      - LINK_SHOULDER_ROLL_L
      - LINK_ELBOW_YAW_L
      - LINK_SHOULDER_ROLL_R
      - LINK_ELBOW_YAW_R
      - LINK_HEAD_YAW
play_profile:
  enabled: true
  env:
    max_episode_seconds: 22.0
    commands:
      motion:
        <<: *motion_command
        params:
          <<: *motion_params
          sampling_mode: start
