# @package _global_
# T015: FlashSAC / WoState history5 (446D) / dr_light / seed1.
# Source: logs/t800_T_sigma015_std025_seed1_50k_20261009_132732/run_config.json
# Historical run/checkpoints: 50k; subsequent quick experiments default to 25k.
# Joint position reward: weight=4, std=0.25; joint velocity weight=0;
# temperature target sigma=0.15; physics=200Hz, control=50Hz, action delay=20ms.
# No dependence on the old E03 task YAML or the removed dr_light overlay files.
# Existing environment registry identity is reused; task owner name is t015.
# Required fixed-per-environment material and CoM terms are provided by
# engineai_rl_unilab.tasks.t800.manager_terms in this branch.
# Play profile preserves the source DR/noise and only starts motion from frame 0;
# it is NOT the no-DR/no-noise diagnostic playback protocol.
# Select this task owner with:
# uv run --no-sync engineai-train --algo flashsac --task engineai_t800_t015 --sim mjwarp
training:
  task_name: EngineAIT800MotionTracking
  sim_backend: mjwarp
  logger: tensorboard
  no_play: true
  sim2sim_strict: true
  export_onnx: true
  play_env_num: 1
  play_steps: 1000
  inference_request_timeout_sec: 300.0
algo:
  algo: flashsac
  algo_log_name: flash_sac
  load_run: '-1'
  seed: 1
  num_envs: 2048
  batch_size: 2048
  replay_buffer_n: 512
  updates_per_step: 4
  learning_starts: 98
  policy_frequency: 2
  max_iterations: 25000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  actor_lr: 0.0003
  critic_lr: 0.0003
  actor_hidden_dim: 128
  critic_hidden_dim: 256
  num_atoms: 101
  obs_normalization: false
  use_layer_norm: false
  algo_params:
    normalize_reward: true
    normalized_g_max: 5.0
    actor_num_blocks: 2
    critic_num_blocks: 2
    actor_bc_alpha: 0.0
    actor_noise_zeta_mu: 2.0
    actor_noise_zeta_max: 16
    critic_min_v: -5.0
    critic_max_v: 5.0
    temp_initial_value: 0.01
    temp_target_sigma: 0.15
    temp_target_entropy: null
    learning_rate_init: 0.0003
    learning_rate_peak: 0.0003
    learning_rate_end: 0.00015
    learning_rate_warmup_steps: 0
    learning_rate_decay_steps: 500000
    n_step: 1
    amp_dtype: auto
    use_compile: true
    use_cuda_graph_critic: false
    use_cuda_graph_actor: false
    use_cuda_graph_critic_packed_staging: false
    use_cuda_graph_actor_packed_staging: false
