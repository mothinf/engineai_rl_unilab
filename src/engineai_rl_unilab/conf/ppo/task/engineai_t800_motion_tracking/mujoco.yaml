# @package _global_
# Hardware-validated T800 WoState motion-tracking owner.
# Source: mothinf/unilab-t800-motion-tracking@50fe86a3b, leaf owner
# task=t800_motion_tracking/mujoco_wostate_dr_ref_v2.  This flattened owner is
# the configuration used for the 3-substep, full-DR, 40000-iteration run.
defaults:
  # T800 is a standalone motion-tracking task.  Do not inherit the G1 task:
  # all observations, actions, commands, terminations, and rewards below are
  # intentionally declared for the 25-DoF T800 model.
  []

training:
  task_name: EngineAIT800MotionTracking
  sim_backend: mujoco
  play_steps: 1000
  # Frame the default 4 x 4 playback grid; training.render_spacing is passed
  # explicitly to the renderer, independently of play_profile.env below.
  play_env_num: 16
  render_spacing: 2.0
  cam_distance: 9.0
  cam_elevation: -20.0
  cam_azimuth: 135.0
  # first18s motion is centered near (2.1, -3.9); add the 4 x 4 grid center (3, 3).
  cam_lookat: [5.1, -0.9, 0.85]
  cam_tracking: false

algo:
  seed: 1
  num_envs: 1024
  max_iterations: 40000
  save_interval: 500
  empirical_normalization: true
  obs_groups:
    actor: [actor]
    critic: [critic]
  algorithm:
    entropy_coef: 0.005
    desired_kl: 0.01

env:
  scene:
    model_file: assets/robots/t800/scene_flat.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: LINK_BASE
        joint_names: &t800_joints
          - J00_HIP_PITCH_L
          - J01_HIP_ROLL_L
          - J02_HIP_YAW_L
          - J03_KNEE_PITCH_L
          - J04_ANKLE_PITCH_L
          - J05_ANKLE_ROLL_L
          - J06_HIP_PITCH_R
          - J07_HIP_ROLL_R
          - J08_HIP_YAW_R
          - J09_KNEE_PITCH_R
          - J10_ANKLE_PITCH_R
          - J11_ANKLE_ROLL_R
          - J12_TORSO_YAW
          - J13_SHOULDER_PITCH_L
          - J14_SHOULDER_ROLL_L
          - J15_SHOULDER_YAW_L
          - J16_ELBOW_PITCH_L
          - J17_ELBOW_YAW_L
          - J18_SHOULDER_PITCH_R
          - J19_SHOULDER_ROLL_R
          - J20_SHOULDER_YAW_R
          - J21_ELBOW_PITCH_R
          - J22_ELBOW_YAW_R
          - J23_HEAD_PITCH
          - J24_HEAD_YAW
        actuator_names: *t800_joints
        body_names:
          - LINK_BASE
          - LINK_HIP_PITCH_L
          - LINK_HIP_ROLL_L
          - LINK_HIP_YAW_L
          - LINK_KNEE_PITCH_L
          - LINK_ANKLE_PITCH_L
          - LINK_ANKLE_ROLL_L
          - LINK_FOOT_L
          - LINK_HIP_PITCH_R
          - LINK_HIP_ROLL_R
          - LINK_HIP_YAW_R
          - LINK_KNEE_PITCH_R
          - LINK_ANKLE_PITCH_R
          - LINK_ANKLE_ROLL_R
          - LINK_FOOT_R
          - LINK_WAIST_YAW
          - LINK_SHOULDER_PITCH_L
          - LINK_SHOULDER_ROLL_L
          - LINK_SHOULDER_YAW_L
          - LINK_ELBOW_PITCH_L
          - LINK_ELBOW_YAW_L
          - LINK_WRIST_END_L
          - LINK_SHOULDER_PITCH_R
          - LINK_SHOULDER_ROLL_R
          - LINK_SHOULDER_YAW_R
          - LINK_ELBOW_PITCH_R
          - LINK_ELBOW_YAW_R
          - LINK_WRIST_END_R
          - LINK_HEAD_PITCH
          - LINK_HEAD_YAW
        geom_names:
          - left_foot_contact_0_geom
          - left_foot_contact_1_geom
          - left_foot_contact_2_geom
          - left_foot_contact_3_geom
          - right_foot_contact_0_geom
          - right_foot_contact_1_geom
          - right_foot_contact_2_geom
          - right_foot_contact_3_geom
  # User override: three physics substeps per 50 Hz control step.
  sim_dt: 0.006666666666666667
  ctrl_dt: 0.02
  # Keep the motion-tracking horizon at the shared 500 control-step cap.
  # T800 runs its controller at 50 Hz (0.02 s/step), so this is 10 seconds.
  max_episode_seconds: 10.0
  observations:
    actor:
      enable_corruption: true
      terms:
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: motion
        # WoState actor: these privileged state estimates are critic-only.
        motion_anchor_pos_b: null
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params:
            command_name: motion
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.05
            n_max: 0.05
        base_lin_vel: null
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params:
            command_name: motion
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: [-0.5, -0.5, -0.5, -0.5, -3.0, -3.0, -0.5, -0.5, -0.5, -0.5, -3.0, -3.0, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5]
            n_max: [0.5, 0.5, 0.5, 0.5, 3.0, 3.0, 0.5, 0.5, 0.5, 0.5, 3.0, 3.0, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
        actions:
          func: unilab.envs.mdp.last_action
    critic:
      terms:
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: motion
        motion_anchor_pos_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_pos_b
          params:
            command_name: motion
        motion_anchor_ori_b:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params:
            command_name: motion
        body_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_pos_b
          params:
            command_name: motion
        body_ori:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_ori_b
          params:
            command_name: motion
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: pelvis_local_linvel
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
        joint_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params:
            command_name: motion
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
  policy_observation_group: actor
  critic_observation_group: critic
  actions:
    joint_pos:
      _target_: engineai_rl_unilab.tasks.t800.manager_terms.OfficialDelayedMotionJointPositionActionCfg
      entity_name: robot
      actuator_names: *t800_joints
      scale:
        J00_HIP_PITCH_L: 0.5
        J01_HIP_ROLL_L: 0.2
        J02_HIP_YAW_L: 0.2
        J03_KNEE_PITCH_L: 0.5
        J04_ANKLE_PITCH_L: 0.5
        J05_ANKLE_ROLL_L: 0.2
        J06_HIP_PITCH_R: 0.5
        J07_HIP_ROLL_R: 0.2
        J08_HIP_YAW_R: 0.2
        J09_KNEE_PITCH_R: 0.5
        J10_ANKLE_PITCH_R: 0.5
        J11_ANKLE_ROLL_R: 0.2
        J12_TORSO_YAW: 0.2
        J13_SHOULDER_PITCH_L: 0.2
        J14_SHOULDER_ROLL_L: 0.2
        J15_SHOULDER_YAW_L: 0.05
        J16_ELBOW_PITCH_L: 0.2
        J17_ELBOW_YAW_L: 0.05
        J18_SHOULDER_PITCH_R: 0.2
        J19_SHOULDER_ROLL_R: 0.2
        J20_SHOULDER_YAW_R: 0.05
        J21_ELBOW_PITCH_R: 0.2
        J22_ELBOW_YAW_R: 0.05
        J23_HEAD_PITCH: 0.2
        J24_HEAD_YAW: 0.2
      use_default_offset: true
      command_name: motion
      simulate_action_latency: false
      min_delay: 1
      max_delay: 3
      delay_groups:
        hip_pitch_and_knee_pitch:
          - J00_HIP_PITCH_L
          - J06_HIP_PITCH_R
          - J03_KNEE_PITCH_L
          - J09_KNEE_PITCH_R
        hip_roll:
          - J01_HIP_ROLL_L
          - J07_HIP_ROLL_R
        hip_yaw:
          - J02_HIP_YAW_L
          - J08_HIP_YAW_R
        ankles:
          - J04_ANKLE_PITCH_L
          - J05_ANKLE_ROLL_L
          - J10_ANKLE_PITCH_R
          - J11_ANKLE_ROLL_R
        torso_yaw:
          - J12_TORSO_YAW
        shoulder_and_elbow_pitch:
          - J13_SHOULDER_PITCH_L
          - J14_SHOULDER_ROLL_L
          - J15_SHOULDER_YAW_L
          - J16_ELBOW_PITCH_L
          - J18_SHOULDER_PITCH_R
          - J19_SHOULDER_ROLL_R
          - J20_SHOULDER_YAW_R
          - J21_ELBOW_PITCH_R
        heads_and_elbow_yaw:
          - J17_ELBOW_YAW_L
          - J22_ELBOW_YAW_R
          - J23_HEAD_PITCH
          - J24_HEAD_YAW
  commands:
    motion:
      _target_: engineai_rl_unilab.tasks.t800.manager_terms.OfficialMotionCommandCfg
      motion_adapter: t800_isaac_v1
      motion_model_file: ${env.scene.model_file}
      entity_name: robot
      resampling_time_range: [1.0e9, 1.0e9]
      params:
        motion_file: assets/motions/t800/dance1_subject2_t800_first18s.npz
        anchor_body_name: LINK_BASE
        body_names:
          - LINK_BASE
          - LINK_HIP_ROLL_L
          - LINK_KNEE_PITCH_L
          - LINK_ANKLE_ROLL_L
          - LINK_HIP_ROLL_R
          - LINK_KNEE_PITCH_R
          - LINK_ANKLE_ROLL_R
          - LINK_WAIST_YAW
          - LINK_SHOULDER_ROLL_L
          - LINK_ELBOW_YAW_L
          - LINK_WRIST_END_L
          - LINK_SHOULDER_ROLL_R
          - LINK_ELBOW_YAW_R
          - LINK_WRIST_END_R
          - LINK_HEAD_YAW
        sampling_mode: adaptive
        sampling_start_ratio: 0.0
        truncate_on_clip_end: false
        pose_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.01, 0.01]
          roll: [-0.1, 0.1]
          pitch: [-0.1, 0.1]
          yaw: [-0.2, 0.2]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.52, 0.52]
          pitch: [-0.52, 0.52]
          yaw: [-0.78, 0.78]
        joint_position_range: [-0.1, 0.1]
        joint_default_position_range: [-0.01, 0.01]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    anchor_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_pos_z_only
      params: {command_name: motion, threshold: 0.35}
    anchor_ori:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_ori
      params:
        command_name: motion
        threshold: 0.8
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    ee_body_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_motion_body_pos_z_only
      params:
        command_name: motion
        threshold: 0.35
        body_names:
          - LINK_ANKLE_ROLL_L
          - LINK_ANKLE_ROLL_R
          - LINK_WRIST_END_L
          - LINK_WRIST_END_R

  events:
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [1.0, 3.0]
      params:
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.52, 0.52]
          pitch: [-0.52, 0.52]
          yaw: [-0.78, 0.78]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    # Values are sampled once per environment and restored on every reset.
    physics_material:
      func: engineai_rl_unilab.tasks.t800.manager_terms.OfficialMujocoRigidBodyMaterial
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          geom_names: ".*"
        static_friction_range: [0.3, 1.6]
        dynamic_friction_range: [0.3, 1.2]
        restitution_range: [0.0, 0.5]
        num_buckets: 64
    base_com:
      func: engineai_rl_unilab.tasks.t800.manager_terms.OfficialFixedRigidBodyCom
      mode: reset
      params:
        com_range:
          x: [-0.1, 0.1]
          y: [-0.1, 0.1]
          z: [-0.1, 0.1]
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: LINK_WAIST_YAW
    official_pd_hip_pitch_and_knee_pitch:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [180.0, 180.0]
        kd_range: [5.0, 5.0]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J00_HIP_PITCH_L
            - J03_KNEE_PITCH_L
            - J06_HIP_PITCH_R
            - J09_KNEE_PITCH_R
    official_pd_hip_roll:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [100.0, 100.0]
        kd_range: [3.0, 3.0]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J01_HIP_ROLL_L
            - J07_HIP_ROLL_R
    official_pd_hip_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [100.0, 100.0]
        kd_range: [3.0, 3.0]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J02_HIP_YAW_L
            - J08_HIP_YAW_R
    official_pd_ankles:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [40.0, 40.0]
        kd_range: [2.0, 2.0]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J04_ANKLE_PITCH_L
            - J05_ANKLE_ROLL_L
            - J10_ANKLE_PITCH_R
            - J11_ANKLE_ROLL_R
    official_pd_torso_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [100.0, 100.0]
        kd_range: [3.0, 3.0]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J12_TORSO_YAW
    official_pd_shoulders_and_elbow_pitch:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [50.0, 50.0]
        kd_range: [0.3, 0.3]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J13_SHOULDER_PITCH_L
            - J14_SHOULDER_ROLL_L
            - J15_SHOULDER_YAW_L
            - J16_ELBOW_PITCH_L
            - J18_SHOULDER_PITCH_R
            - J19_SHOULDER_ROLL_R
            - J20_SHOULDER_YAW_R
            - J21_ELBOW_PITCH_R
    official_pd_heads_and_elbow_yaw:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        kp_range: [50.0, 50.0]
        kd_range: [0.3, 0.3]
        operation: abs
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          actuator_names:
            - J17_ELBOW_YAW_L
            - J22_ELBOW_YAW_R
            - J23_HEAD_PITCH
            - J24_HEAD_YAW

reward:
  motion_global_root_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_position_error_exp
    weight: 0.5
    params:
      command_name: motion
      std: 0.45
  motion_global_root_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_orientation_error_exp
    weight: 0.5
    params:
      command_name: motion
      std: 0.4
  motion_body_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.45
  motion_body_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_orientation_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 0.4
  motion_body_lin_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 1.0
  motion_body_ang_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_exp
    weight: 1.0
    params:
      command_name: motion
      std: 3.14
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.075
  joint_limit:
    func: engineai_rl_unilab.tasks.t800.manager_terms.official_joint_pos_limits
    weight: -10.0
    params:
      soft_limit_factor: 0.9
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        joint_names: .*
  undesired_contacts:
    func: engineai_rl_unilab.tasks.t800.manager_terms.undesired_body_height_contacts
    weight: -0.1
    params:
      threshold: 0.05
      asset_cfg:
        _target_: unilab.managers.SceneEntityCfg
        name: robot
        body_names:
          - LINK_BASE
          - LINK_HIP_PITCH_L
          - LINK_HIP_ROLL_L
          - LINK_HIP_YAW_L
          - LINK_KNEE_PITCH_L
          - LINK_ANKLE_PITCH_L
          - LINK_FOOT_L
          - LINK_HIP_PITCH_R
          - LINK_HIP_ROLL_R
          - LINK_HIP_YAW_R
          - LINK_KNEE_PITCH_R
          - LINK_ANKLE_PITCH_R
          - LINK_FOOT_R
          - LINK_WAIST_YAW
          - LINK_SHOULDER_PITCH_L
          - LINK_SHOULDER_ROLL_L
          - LINK_SHOULDER_YAW_L
          - LINK_ELBOW_PITCH_L
          - LINK_ELBOW_YAW_L
          - LINK_SHOULDER_PITCH_R
          - LINK_SHOULDER_ROLL_R
          - LINK_SHOULDER_YAW_R
          - LINK_ELBOW_PITCH_R
          - LINK_ELBOW_YAW_R
          - LINK_HEAD_PITCH
          - LINK_HEAD_YAW

play_profile:
  enabled: true
  env:
    render_spacing: 2.0
    max_episode_seconds: 22.0
